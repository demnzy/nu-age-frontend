<!DOCTYPE html>
<html>
<head>
    <title>YouTube Embed Test</title>
</head>
<body style="background: #111; color: white; font-family: sans-serif; padding: 20px;">
    <h2>Test 1: Standard youtube.com/embed/</h2>
    <iframe width="400" height="225" src="https://www.youtube.com/embed/aFDOzpTeg0s" frameborder="0" allowfullscreen></iframe>

    <h2>Test 2: youtube-nocookie.com/embed/</h2>
    <iframe width="400" height="225" src="https://www.youtube-nocookie.com/embed/aFDOzpTeg0s" frameborder="0" allowfullscreen></iframe>

    <h2>Test 3: youtube.com with allow attributes</h2>
    <iframe width="400" height="225" src="https://www.youtube.com/embed/aFDOzpTeg0s" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
</body>
</html>
