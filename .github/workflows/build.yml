name: Build Nu Age Windows (Manual Env Mode)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows App
    runs-on: windows-latest

    # Force bash to preserve grep, rm, and tee commands on the Windows runner
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for deprecated Flet 0.84-style API usage
        run: |
          # Fail in seconds, not minutes. ft.Padding.*, ft.alignment.*, ft.Margin.*
          # were lowercase-module/function-style helpers in 0.84 and were replaced
          # by capitalized classes with keyword-only args in 0.85/0.86 (V1 breaking
          # changes). 
          if grep -rn "ft\.padding\.\|ft\.alignment\.\|ft\.margin\." --include="*.py" .; then
            echo "::error::Found 0.84-style Flet API calls (see lines above). These break on flet>=0.85. Either migrate to ft.Padding/ft.Alignment/ft.Margin, or add a compatibility shim before this check will pass intentionally."
            exit 1
          fi
          echo "No deprecated 0.84-style API calls found."

      # Setup Java step is removed as it is only required for Android SDK / Gradle

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          # IMPORTANT: All flet-* packages must be pinned to the SAME patch version
          pip install flet-cli==0.86.5 flet==0.86.5 flet-video==0.86.5 flet-charts==0.86.5 httpx==0.28.1 requests==2.33.1

      - name: Verify matching flet toolchain versions
        run: |
          # Fail fast instead of getting cryptic Dart compile errors
          python -c "
          import importlib.metadata as m
          pkgs = ['flet', 'flet-cli', 'flet-video', 'flet-charts']
          versions = {p: m.version(p) for p in pkgs}
          print(versions)
          vals = set(versions.values())
          assert len(vals) == 1, f'flet-family version mismatch: {versions}'
          "
          flet doctor

      - name: Clean Flet build cache
        run: rm -rf build .flet_build ~/.flet 2>/dev/null || true

      - name: Compile the Windows App
        env:
          PYTHONUTF8: "1" # Forces Python to use UTF-8 instead of cp1252 to prevent UI crashes
        run: |
          set -o pipefail
          # Windows builds default to the host architecture (x64)
          # Pass --yes to auto-accept the Flutter SDK installation prompt
          flet build windows --yes --product "Nu Age" --python-version 3.12 --verbose 2>&1 | tee flet_build.log || true
          
          # Use case-insensitive grep to catch the success string universally
          if ! grep -q -i "successfully built" flet_build.log; then
            echo "::error::CRITICAL ERROR: Flet compiler crashed! Check verbose logs for Dart/Python errors."
            exit 1
          fi

      - name: Show extra logs on failure
        if: failure()
        run: tail -n 400 flet_build.log || true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: flet_build.log

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: Nu Age App (Windows)
          # Flet outputs the executable and dependencies into this directory
          path: build/windows/